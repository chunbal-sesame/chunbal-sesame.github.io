<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>춘발이네 제천기름집</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
body{margin:0}*{box-sizing:border-box}
/* 한 줄 세로 흐름: 가게 이름 → 가격표 → 국산 안내 → 연락처 */
:root{
  --bg:#fbf7ee; --fg:#2b2117; --muted:#7a6a55;
  --oil:#c98a12; --perilla:#5d6b2f; --line:#e7dcc6; --card:#fffdf8;
  --display:"Do Hyeon","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1610; --fg:#f2e8d6; --muted:#b3a288; --oil:#e7a92d; --perilla:#a3b56a; --line:#3a2f22; --card:#241c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1610; --fg:#f2e8d6; --muted:#b3a288; --oil:#e7a92d; --perilla:#a3b56a; --line:#3a2f22; --card:#241c14; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:48px 64px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:40px}
header{text-align:left}
.since{display:inline-block;font-weight:600;font-size:14px;letter-spacing:.08em;color:var(--oil);
  border:1.5px solid var(--oil);border-radius:999px;padding:2px 12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:1.05;margin:16px 0 12px;text-wrap:balance}
.lead{color:var(--muted);margin:0;font-size:18px}
h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 12px}
.menu{display:grid;gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.item h3{margin:0 0 10px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0}
.row+.row{border-top:1px dashed var(--line)}
.row span:first-child{color:var(--muted)}
.price{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.item.local{border:2px solid var(--oil)}
.item.local h3{color:var(--oil)}
.contact dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px}
.contact dt{color:var(--muted)}
.contact dd{margin:0;font-weight:600}
.empty{color:var(--muted);font-weight:400}
.map{display:block;margin-top:20px;text-align:center;background:#03c75a;color:#fff;font-weight:800;text-decoration:none;border-radius:12px;padding:14px}
.map:focus-visible{outline:3px solid var(--oil);outline-offset:3px}
footer{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="since">시장에서 30년</span>
    <h1>춘발이네<br>제천기름집</h1>
    <p class="lead">30년 동안 시장에서 직접 볶고 짜 온 참기름·들기름입니다.</p>
  </header>

  <section>
    <h2>가격</h2>
    <div class="menu">
      <div class="item">
        <h3><span class="dot" style="background:var(--oil)"></span>참기름</h3>
        <div class="row"><span>1병</span><span class="price">8,000원</span></div>
        <div class="row"><span>1말 (11병)</span><span class="price">80,000원</span></div>
      </div>
      <div class="item">
        <h3><span class="dot" style="background:var(--perilla)"></span>들기름</h3>
        <div class="row"><span>1병</span><span class="price">10,000원</span></div>
        <div class="row"><span>1말 (7병)</span><span class="price">68,000원</span></div>
      </div>
      <div class="item local">
        <h3>국산</h3>
        <div class="row"><span>국산 참기름 1병</span><span class="price">25,000원</span></div>
        <div class="row"><span>국산 들기름 1병</span><span class="price">20,000원</span></div>
        <p class="note">말 단위는 전화로 문의해 주세요.</p>
      </div>
    </div>
  </section>

  <section class="contact">
    <h2>찾아오시는 길</h2>
    <dl>
      <dt>전화</dt><dd class="empty">준비 중</dd>
      <dt>주소</dt><dd>경기 성남시 중원구 둔촌대로69번길 8</dd>
      <dt>영업시간</dt><dd class="empty">준비 중</dd>
    </dl>
    <a class="map" href="https://naver.me/5bClptdc" target="_blank" rel="noopener">네이버 지도에서 보기</a>
  </section>

  <footer>춘발이네 제천기름집</footer>
</div>
</body>
</html>
